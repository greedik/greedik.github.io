<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Редактор Жабсоны</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <h1>Редактор Жабсоны</h1>

    <div class="layout">

        <div class="panel" id="controls">
            <div class="loading">
                Загрузка конфигурации...
            </div>
        </div>

        <div class="preview">

            <div class="stage" id="stage">
                <!-- PNG-слои добавляются через JavaScript -->
            </div>

            <div class="status" id="status"></div>

            <button class="download" id="downloadButton">
                Скачать PNG
            </button>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
